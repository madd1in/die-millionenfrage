body{

#fx{position:fixed;inset:0;z-index:0;pointer-events:none}

.bigBtn:hover{transform:scale(1.06)}

.hint{color:#9fb4ff;margin-top:14px;text-align:center}
.topbar{width:100%;max-width:1150px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.jokers{display:flex;gap:10px;flex-wrap:wrap}
.joker{min-width:70px;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:900;font-size:1rem;

/* ================= AUDIO-ENGINE ================= */
let AC=null,master=null,musicGain=null,sfxGain=null,noiseBuf=null;
let muted=false,heartTimer=null;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.connect(master);
    sfxGain=AC.createGain();sfxGain.connect(master);
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function getNoise(){ if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; } return noiseBuf; }
function tone(f,dur,type,vol,when,slide){
  if(muted)return;
  const c=ac(),t=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol||0.2,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+dur+0.05);
}

function bassNote(t,f){ const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=650;g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(fl);fl.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.22); }

/* --- Treibender Sequencer (128 BPM) --- */
const BPM=128,STEPT=60/BPM/4;
const CHORDS=[{b:55,n:[220,261.63,329.63]},{b:55,n:[220,261.63,329.63]},{b:43.65,n:[174.61,220,261.63]},{b:41.2,n:[164.81,207.65,246.94]}];
let step=0,nextT=0,seqTimer=null;
function scheduleStep(s,t){
  const bar=Math.floor(s/16),pos=s%16;
  const ch=CHORDS[Math.floor(bar/2)%CHORDS.length];
  if(pos%4===0)kick(t);
  if(pos===4||pos===12)clap(t);
  if(pos%2===0)hat(t,pos%4===2?0.25:0.1);
  if(pos%2===0)bassNote(t,pos===14?ch.b*2:ch.b);
  if(pos%2===1)stab(t,ch.n[Math.floor(s/2)%3]);
  if(pos===0)ch.n.forEach(f=>stab(t,f,0.16));
}
function scheduler(){ while(nextT<AC.currentTime+0.15){ scheduleStep(step,nextT); step++; nextT+=STEPT; } }
function startMusic(){ stopMusic(); ac(); nextT=AC.currentTime+0.05; step=0; seqTimer=setInterval(scheduler,40); }
function stopMusic(){ if(seqTimer){clearInterval(seqTimer);seqTimer=null;} }
function duck(on){ if(musicGain)musicGain.gain.linearRampToValueAtTime(on?0.22:1,AC.currentTime+0.3); }

function speak(text){
  if(muted||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE';u.rate=1;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('de'));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
