<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Millionenfrage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        h1 { color: gold; }
        button {
            background: gold;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { background: orange; }
        .option {
            background: #2d2d44;
            color: white;
            border: 2px solid gold;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            display: block;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        .option:hover { background: #3d3d5c; }
        .correct { background: green !important; }
        .wrong { background: red !important; }
        .info { background: #2d2d44; padding: 20px; border-radius: 10px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="screen active" id="start">
        <h1>💰 Die Millionenfrage</h1>
        <p>Beantworte 15 Fragen und gewinne!</p>
        <button onclick="startGame()">Spiel starten</button>
    </div>

    <div class="screen" id="game">
        <h2 id="level">Frage 1</h2>
        <div class="info" id="prize">Preis: €500</div>
        <div id="question"></div>
        <div id="options"></div>
    </div>

    <div class="screen" id="end">
        <h1 id="endTitle">🎉 Gewonnen!</h1>
        <p id="endMessage"></p>
        <button onclick="location.reload()">Nochmal spielen</button>
    </div>

    <script>
        const questions = [
            {q: "Welches Tier bellt?", o: ["Hund", "Katze", "Vogel", "Fisch"], a: 0},
            {q: "Wie heißt die Hauptstadt von Kuba?", o: ["Havanna", "Madrid", "Rom", "Paris"], a: 0},
            {q: "Wer schrieb 'Krieg und Frieden'?", o: ["Tolstoi", "Dostojewski", "Tschechow", "Puschkin"], a: 0},
            {q: "Für welches Element steht Al?", o: ["Aluminium", "Argon", "Silber", "Gold"], a: 0},
            {q: "Welches Land hat die Form eines Stiefels?", o: ["Italien", "Spanien", "Griechenland", "Frankreich"], a: 0},
            {q: "Welche Ordnungszahl hat Kalium?", o: ["19", "17", "18", "20"], a: 0},
            {q: "Wer schrieb 'Stolz und Vorurteil'?", o: ["Jane Austen", "Emily Brontë", "Virginia Woolf", "Mary Shelley"], a: 0},
            {q: "Welcher Vertrag beendete 1783 den Amerikanischen Unabhängigkeitskrieg?", o: ["Paris", "Versailles", "Wien", "Berlin"], a: 0},
            {q: "Wer schrieb 'Der Idiot'?", o: ["Dostojewski", "Tolstoi", "Gogol", "Tschechow"], a: 0},
            {q: "Welches Enzym wandelt Succinat zu Fumarat um?", o: ["Succinat-Dehydrogenase", "Citrat-Synthase", "Lactase", "Amylase"], a: 0},
            {q: "Was beschreibt der Zentrale Grenzwertsatz?", o: ["Normalverteilung", "Symmetrie", "Nullsumme", "Gleichverteilung"], a: 0},
            {q: "Was ist Crossing-over?", o: ["Chromosomenaustausch", "Mutation", "Translation", "Transkription"], a: 0},
            {q: "Was besagt Le Chatelier?", o: ["Gleichgewichtsverschiebung", "Irreversibilität", "Katalyse", "Temperaturunabhängigkeit"], a: 0},
            {q: "Was ist die Church-Turing-These?", o: ["Berechenbarkeit", "Polynomzeit", "Reguläre Sprache", "Terminierung"], a: 0},
            {q: "Wer schrieb 'Herz der Finsternis'?", o: ["Conrad", "Kipling", "Forster", "Greene"], a: 0}
        ];

        const prizes = ["€500", "€1.000", "€2.000", "€5.000", "€10.000", "€16.000", "€32.000", "€64.000", "€125.000", "€250.000", "€500.000", "€750.000", "€900.000", "€1.000.000", "€10.000.000"];
        let current = 0;

        function startGame() {
            document.getElementById('start').classList.remove('active');
            document.getElementById('game').classList.add('active');
            showQuestion();
        }

        function showQuestion() {
            if (current >= questions.length) {
                endGame(true);
                return;
            }

            const q = questions[current];
            document.getElementById('level').textContent = `Frage ${current + 1} von ${questions.length}`;
            document.getElementById('prize').textContent = `Preis: ${prizes[current]}`;
            document.getElementById('question').innerHTML = `<h3>${q.q}</h3>`;
            
            let optionsHTML = '';
            q.o.forEach((opt, i) => {
                optionsHTML += `<button class="option" onclick="checkAnswer(${i})">${opt}</button>`;
            });
            document.getElementById('options').innerHTML = optionsHTML;
        }

        function checkAnswer(index) {
            const q = questions[current];
            const buttons = document.querySelectorAll('.option');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.a) btn.classList.add('correct');
                if (i === index && i !== q.a) btn.classList.add('wrong');
            });

            setTimeout(() => {
                if (index === q.a) {
                    current++;
                    showQuestion();
                } else {
                    endGame(false);
                }
            }, 2000);
        }

        function endGame(won) {
            document.getElementById('game').classList.remove('active');
            document.getElementById('end').classList.add('active');
            
            if (won) {
                document.getElementById('endTitle').textContent = '🎉 Gewonnen!';
                document.getElementById('endMessage').textContent = `Du hast ${prizes[prizes.length-1]} gewonnen!`;
            } else {
                document.getElementById('endTitle').textContent = '❌ Verloren!';
                document.getElementById('endMessage').textContent = `Du bist bei Frage ${current + 1} gescheitert.`;
            }
        }
    </script>
</body>
</html>
