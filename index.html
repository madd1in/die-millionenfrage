*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.hint{color:#9fb4ff;margin-top:14px}

/* ============ SOUND & MUSIK (Web Audio, keine Dateien) ============ */
let AC=null,muted=false,musicTimer=null,heartTimer=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,type,vol,when,slide){
  if(muted)return;
  const c=ac(),t=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol||0.2,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+dur+0.05);
}
const CHORDS=[[110,164.81,220],[87.31,130.81,174.61],[98,146.83,196],[82.41,123.47,164.81]];
let chordIdx=0;
function playChord(){ if(muted)return; const c=CHORDS[chordIdx++%CHORDS.length];
  tone(c[0]/2,3.8,'triangle',0.07); c.forEach(f=>{tone(f,3.8,'sine',0.05);tone(f*2,3.8,'sine',0.025);}); }
function startMusic(){ stopMusic(); playChord(); musicTimer=setInterval(playChord,4000); }
function stopMusic(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }
function beat(){ tone(55,0.15,'sine',0.5); setTimeout(()=>tone(50,0.12,'sine',0.4),180); }
function startHeart(){ stopHeart(); beat(); heartTimer=setInterval(beat,900); }
function stopHeart(){ if(heartTimer){clearInterval(heartTimer);heartTimer=null;} }
function sSelect(){ tone(880,0.12,'square',0.12); }
function sJoker(){ tone(1200,0.1,'square',0.12); tone(1600,0.12,'square',0.1,0.1); }
function sCorrect(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.35,'triangle',0.22,i*0.12)); }
function sWrong(){ tone(220,0.6,'sawtooth',0.25,0,110); tone(180,0.8,'sawtooth',0.2,0.15,90); }
function sMillion(){ [523.25,659.25,783.99,1046.5,1318.5,1568,2093].forEach((f,i)=>tone(f,0.5,'triangle',0.22,i*0.15)); }

/* ============ SPIELLOGIK ============ */
let level=0,q=null,locked=false,removed=[],used={f:false,p:false,a:false};

function startGame(){
  level=0;locked=false;removed=[];used={f:false,p:false,a:false};
  $('startScreen').hidden=true;$('endScreen').hidden=true;$('gameScreen').hidden=false;
  ['j5050','jPhone','jAud'].forEach(id=>$(id).classList.remove('used'));
  buildLadder();startMusic();loadQuestion();
}
function buildLadder(){
  let html='';
  for(let i=PRIZES.length-1;i>=0;i--){
    const cls=['row'];
    if(SAFE_IDX.includes(i))cls.push('milestone');
    if(i===level)cls.push('current');
    html+='<div class="'+cls.join(' ')+'" data-l="'+i+'"><span>'+ (SAFE_IDX.includes(i)?'◆ ':'') +(i+1)+'</span><span>'+fmt(PRIZES[i])+'</span></div>';
  }
  $('ladder').innerHTML=html;
}
function loadQuestion(){
  locked=false;removed=[];
  const pool=QUESTION_LADDER[level];
  q=pool[Math.floor(Math.random()*pool.length)];
  $('qbox').textContent=q.emoji+'  '+q.question;
  $('factBox').hidden=true;
  for(let i=0;i<4;i++){
    const b=$('a'+i);
    b.textContent=LETTERS[i]+':  '+q.options[i];
    b.className='answer';b.disabled=false;
  }
  buildLadder();
}
function clickAnswer(i){
  if(locked)return;
  locked=true;sSelect();
  $('a'+i).classList.add('selected');
  startHeart();
  setTimeout(()=>reveal(i),3000);
}
function reveal(i){
  stopHeart();
  const correctIdx=q.options.indexOf(q.answer);
  if(i===correctIdx){
    $('a'+i).classList.remove('selected');$('a'+i).classList.add('correct');
    if(level===PRIZES.length-1){ sMillion(); } else { sCorrect(); }
    $('factText').textContent=q.emoji+' '+q.fact;
    $('factBox').hidden=false;
    $('nextBtn').textContent=(level===PRIZES.length-1)?'🏆 Gewinn abholen':'Nächste Frage ➜';
  }else{
    $('a'+i).classList.remove('selected');$('a'+i).classList.add('wrong');
    $('a'+correctIdx).classList.add('correct');
    sWrong();
    const win=level>SAFE_IDX[1]?PRIZES[SAFE_IDX[1]]:(level>SAFE_IDX[0]?PRIZES[SAFE_IDX[0]]:0);
    setTimeout(()=>endGame('❌ Leider falsch!',win,'Die richtige Antwort war '+LETTERS[correctIdx]+': '+q.answer+'. Dank Sicherheitsstufe '+ (win>0?fmt(win):'') +' gehst du mit '+fmt(win)+' nach Hause.'),2500);
  }
}
function nextQuestion(){
  if(level===PRIZES.length-1){ endGame('🏆 1 MILLION GEWONNEN!',PRIZES[14],'Unfassbar! Du hast alle 15 Fragen richtig beantwortet und die Million geholt!'); sMillion(); return; }
  level++;loadQuestion();
}
function walkAway(){
  const amount=level>0?PRIZES[level-1]:0;
  if(confirm('Mit '+fmt(amount)+' sicher aussteigen?')) endGame('🚪 Ausgestiegen!',amount,'Klug entschieden! Du nimmst '+fmt(amount)+' mit nach Hause.');
}
function endGame(title,amount,msg){
  stopHeart();stopMusic();
  $('gameScreen').hidden=true;$('endScreen').hidden=false;
  $('endTitle').textContent=title;
  $('endAmount').textContent=fmt(amount);
  $('endMsg').textContent=msg;
}

/* ============ JOKER ============ */
function useFifty(){
  if(used.f||locked)return; used.f=true;sJoker();$('j5050').classList.add('used');
  const correctIdx=q.options.indexOf(q.answer);
  const wrong=[0,1,2,3].filter(i=>i!==correctIdx);
  wrong.sort(()=>Math.random()-0.5);
  removed=wrong.slice(0,2);
  removed.forEach(i=>{ $('a'+i).classList.add('gone');$('a'+i).disabled=true; });
}
function usePhone(){
  if(used.p||locked)return; used.p=true;sJoker();$('jPhone').classList.add('used');
  const correctIdx=q.options.indexOf(q.answer);
  const avail=[0,1,2,3].filter(i=>!removed.includes(i));
  let guess=correctIdx;
  if(Math.random()<0.25){ const others=avail.filter(i=>i!==correctIdx); if(others.length) guess=others[Math.floor(Math.random()*others.length)]; }
  const names=['Alex','Maria','Jonas','Sophie'];
  const name=names[Math.floor(Math.random()*names.length)];
  const conf=60+Math.floor(Math.random()*35);
  $('modalContent').innerHTML='<b>📞 Telefonjoker: '+name+'</b><br><br>„Hmm, lass mich nachdenken… Ich bin mir zu '+conf+'% sicher, die Antwort ist <b>'+LETTERS[guess]+': '+q.options[guess]+'</b>. Vertrau mir!“';
  $('modal').hidden=false;
}
function useAudience(){
  if(used.a||locked)return; used.a=true;sJoker();$('jAud').classList.add('used');
  const correctIdx=q.options.indexOf(q.answer);
  const avail=[0,1,2,3].filter(i=>!removed.includes(i));
  let pct={};avail.forEach(i=>pct[i]=0);
  pct[correctIdx]=45+Math.floor(Math.random()*30);
  let rest=100-pct[correctIdx];
  const others=avail.filter(i=>i!==correctIdx);
  others.forEach((i,k)=>{ if(k===others.length-1){pct[i]=rest;} else {const v=Math.floor(Math.random()*rest);pct[i]=v;rest-=v;} });
  let html='<b>👥 Publikumsjoker – Ergebnis:</b><br>';
  for(let i=0;i<4;i++){
    const p=removed.includes(i)?0:(pct[i]||0);
    html+='<div class="audRow"><b>'+LETTERS[i]+'</b><div class="barWrap"><div class="bar" style="width:'+p+'%"></div></div><span>'+p+'%</span></div>';
  }
  $('modalContent').innerHTML=html;
  $('modal').hidden=false;
}

/* ============ EVENTS ============ */
$('startBtn').onclick=()=>{ ac(); startGame(); };
for(let i=0;i<4;i++){ $('a'+i).onclick=()=>clickAnswer(i); }
$('nextBtn').onclick=nextQuestion;
$('walkBtn').onclick=walkAway;
$('j5050').onclick=useFifty;
$('jPhone').onclick=usePhone;
$('jAud').onclick=useAudience;
$('modalClose').onclick=()=>{ $('modal').hidden=true; };
$('muteBtn').onclick=()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; };
</script>
</body>
