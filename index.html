<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#05041a">
  <title>Die Millionenfrage</title>

  <style>
    [hidden] {
      display: none !important;
    }

    :root {
      color-scheme: dark;
      --vh: 1vh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: calc(var(--vh, 1vh) * 100);
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Verdana, Arial, sans-serif;
      line-height: 1.25;
      user-select: none;
      background: #000;
      color: #ffd700;
    }

    body.gameActive {
      overflow: hidden;
    }

    button {
      font: inherit;
      font-weight: 900;
      font-size: 1.35rem;
      min-height: 4.5rem;
      padding: 0.7rem;
      border-radius: 1.2rem;
      border: 4px solid #ffd700;
      background: #111;
      color: #ffd700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 6px solid #fff;
      outline-offset: 3px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.35;
    }

    .primary {
      background: #ffd700;
      color: #000;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: calc(var(--vh, 1vh) * 100);
      display: grid;
      place-items: center;
      padding: 1rem;
      animation: screenIn 0.3s ease;
      overflow: hidden;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .hero,
    .endBox {
      width: min(100%, 820px);
      padding: 1.2rem;
      text-align: center;
      display: grid;
      gap: 1rem;
      background: #111;
      border: 5px solid #ffd700;
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.6rem;
      margin: 0;
    }

    .subtitle {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .startOptions {
      display: grid;
      gap: 0.8rem;
    }

    .difficultyPicker {
      margin: 0;
      padding: 0.65rem;
      border: 3px solid #ffd700;
      border-radius: 1rem;
    }

    .difficultyPicker legend {
      padding: 0 0.45rem;
      color: #fff;
      font-weight: 900;
    }

    .difficultyButtons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
    }

    .difficultyBtn {
      min-height: 3.25rem;
      padding: 0.45rem 0.3rem;
      font-size: 1rem;
      border-width: 3px;
    }

    .difficultyBtn[aria-pressed="true"] {
      background: #ffd700;
      color: #000;
      box-shadow: 0 0 0 3px #fff;
    }

    @media (min-width: 700px) {
      .startOptions {
        grid-template-columns: 1fr 1fr;
      }
    }

    #gameScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: calc(var(--vh, 1vh) * 100);
      padding: 0.7rem;
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
      gap: 0.7rem;
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      align-items: center;
      background: #111;
      border: 4px solid #ffd700;
      border-radius: 1.2rem;
      padding: 0.6rem;
    }

    .topButtons {
      display: flex;
      gap: 0.5rem;
    }

    .iconBtn {
      min-width: 3.4rem;
      min-height: 3.4rem;
      font-size: 1.5rem;
      border-radius: 1rem;
      padding: 0;
    }

    .statusRow {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.6rem;
      align-items: center;
      font-weight: 900;
      font-size: 1.25rem;
    }

    .timerBox {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem;
      align-items: center;
    }

    #timerWrap {
      height: 1.3rem;
      border-radius: 999px;
      overflow: hidden;
      background: #222;
      border: 3px solid #ffd700;
    }

    #timerFill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #84cc16);
      transition: width 0.1s linear;
    }

    #timerFill.low {
      background: linear-gradient(90deg, #ef4444, #f97316);
    }

    #timerText {
      min-width: 3.2rem;
      text-align: center;
      font-size: 1.35rem;
    }

    #notice {
      padding: 0.7rem;
      border-radius: 1rem;
      border: 3px solid #ffd700;
      background: #111;
      font-weight: 900;
      text-align: center;
      font-size: 1.25rem;
      animation: screenIn 0.2s ease;
      pointer-events: none;
    }

    #questionCard {
      background: #111;
      border: 5px solid #ffd700;
      border-radius: 1.4rem;
      padding: 1rem;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.8rem;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.4);
    }

    #qEmoji {
      font-size: 3rem;
      line-height: 1;
    }

    #qText {
      font-size: clamp(1.7rem, 6vw, 2.7rem);
      font-weight: 900;
    }

    #bossBadge {
      width: fit-content;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: #ffd700;
      color: #000;
      border: 3px solid #fff;
    }

    .questionTextWrap {
      display: grid;
      gap: 0.4rem;
    }

    #answers {
      display: grid;
      gap: 0.7rem;
      min-height: 0;
    }

    .answer {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.7rem;
      align-items: center;
      text-align: left;
      padding: 0.7rem 0.8rem;
      min-height: 4.8rem;
      border-radius: 1.2rem;
      border: 4px solid #ffd700;
      background: #111;
      color: #ffd700;
      font-size: clamp(1.35rem, 5vw, 2.1rem);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    .answer .letter {
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      font-weight: 900;
      background: #ffd700;
      color: #000;
    }

    .answer.selected {
      background: #ffd700;
      color: #000;
    }

    .answer.selected .letter {
      background: #fff;
      color: #000;
    }

    .answer.correct {
      background: #22c55e;
      border-color: #dcfce7;
      color: #052e16;
    }

    .answer.wrong {
      background: #ef4444;
      border-color: #fecaca;
      color: #fff;
    }

    .answer.disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    .answer.hint {
      outline: 6px solid #fff;
      animation: pulseHint 0.8s infinite alternate;
    }

    @keyframes pulseHint {
      from {
        box-shadow: 0 0 10px #fff;
      }
      to {
        box-shadow: 0 0 30px #fff;
      }
    }

    #jokers {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.7rem;
    }

    .joker {
      min-height: 4.6rem;
      font-size: 1.3rem;
    }

    .joker.used {
      text-decoration: line-through;
      opacity: 0.35;
    }

    #endAmount {
      font-size: 3rem;
      font-weight: 900;
      color: #ffd700;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(5.8rem + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(220%);
      z-index: 90;
      max-width: min(94vw, 700px);
      padding: 0.8rem 1rem;
      border-radius: 1.2rem;
      border: 4px solid #ffd700;
      background: #111;
      color: #ffd700;
      font-weight: 900;
      font-size: 1.2rem;
      transition: transform 0.28s ease;
      text-align: center;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 70;
    }

    .confetti-piece {
      position: absolute;
      top: -2rem;
      border-radius: 22%;
      opacity: 0.96;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(112vh) rotate(720deg);
        opacity: 0;
      }
    }

    #dangerVignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 64;
      opacity: 0;
      background: radial-gradient(circle, transparent 55%, rgba(239, 68, 68, 0.3));
      transition: opacity 0.3s;
    }

    body.timeDanger #dangerVignette {
      opacity: 1;
      animation: dangerPulse 0.75s infinite alternate;
    }

    @keyframes dangerPulse {
      from {
        opacity: 0.55;
      }
      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    :root {
      --night: #05041a;
      --navy: #09083a;
      --blue: #1729a6;
      --violet: #5b2ee8;
      --electric: #6877ff;
      --gold: #f4b942;
      --gold-light: #ffe59a;
      --cyan: #91e8ff;
      --panel: rgba(7, 8, 43, 0.94);
    }

    body {
      font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 38%, rgba(93, 65, 255, 0.32) 0 14%, transparent 38%),
        radial-gradient(ellipse at 12% 12%, rgba(49, 83, 255, 0.26), transparent 35%),
        radial-gradient(ellipse at 88% 18%, rgba(154, 44, 255, 0.2), transparent 35%),
        linear-gradient(155deg, #020313 0%, var(--night) 48%, #090333 100%);
      background-attachment: fixed;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -35vmax;
      z-index: -1;
      pointer-events: none;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(92, 111, 255, 0.08) 0deg 2deg,
        transparent 2deg 15deg
      );
      animation: studioSweep 55s linear infinite;
    }

    body::after {
      inset: 0;
      background:
        radial-gradient(circle at 50% 44%, transparent 0 20%, rgba(5, 4, 26, 0.52) 62%, rgba(1, 1, 10, 0.94) 100%),
        repeating-linear-gradient(90deg, transparent 0 78px, rgba(139, 151, 255, 0.025) 79px 80px);
      animation: none;
    }

    @keyframes studioSweep {
      to { transform: rotate(360deg); }
    }

    button {
      color: #f7f7ff;
      border: 2px solid rgba(159, 176, 255, 0.82);
      background:
        linear-gradient(180deg, rgba(37, 46, 130, 0.96), rgba(8, 10, 53, 0.98));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 0 0 1px rgba(20, 28, 110, 0.8),
        0 12px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--gold-light);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        0 0 22px rgba(104, 119, 255, 0.45),
        0 14px 34px rgba(0, 0, 0, 0.42);
    }

    button:focus-visible {
      outline: 4px solid var(--cyan);
      outline-offset: 4px;
    }

    .primary {
      color: #120b00;
      border-color: #fff1bc;
      background: linear-gradient(180deg, #ffe995 0%, var(--gold) 48%, #c8790c 100%);
      text-shadow: 0 1px rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 30px rgba(244, 185, 66, 0.38), 0 14px 30px rgba(0, 0, 0, 0.42);
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: calc(var(--vh, 1vh) * 100);
      isolation: isolate;
    }

    .hero,
    .endBox {
      position: relative;
      overflow: hidden;
      color: #fff;
      border: 2px solid rgba(193, 206, 255, 0.9);
      border-radius: 2rem;
      background:
        radial-gradient(circle at 50% 5%, rgba(102, 76, 255, 0.42), transparent 45%),
        linear-gradient(160deg, rgba(17, 22, 89, 0.98), rgba(4, 5, 35, 0.98));
      box-shadow:
        0 0 0 6px rgba(44, 50, 156, 0.28),
        0 0 70px rgba(91, 46, 232, 0.4),
        0 30px 80px rgba(0, 0, 0, 0.62);
    }

    .hero::before,
    .hero::after,
    .endBox::before,
    .endBox::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 23rem;
      height: 23rem;
      border: 1px solid rgba(176, 192, 255, 0.19);
      border-radius: 50%;
      transform: translate(-50%, -55%);
      z-index: -1;
      box-shadow: 0 0 0 2rem rgba(95, 72, 255, 0.06), 0 0 0 5rem rgba(95, 72, 255, 0.035);
    }

    .hero::after,
    .endBox::after {
      top: auto;
      bottom: -9rem;
      width: 16rem;
      height: 16rem;
      transform: translateX(-50%);
    }

    .brandMark {
      width: 7.2rem;
      aspect-ratio: 1;
      margin: 0 auto -0.2rem;
      display: grid;
      place-items: center;
      border: 3px solid var(--gold-light);
      border-radius: 50%;
      background:
        repeating-conic-gradient(from 12deg, rgba(255,255,255,.26) 0 2deg, transparent 2deg 18deg),
        radial-gradient(circle, #241b82 0 42%, #0a0d53 43% 63%, #5865ed 64% 66%, #06062f 67%);
      box-shadow: 0 0 35px rgba(104, 119, 255, 0.72), inset 0 0 24px rgba(0, 0, 0, 0.65);
      transform: rotate(-5deg);
    }

    .brandMark span {
      max-width: 5.2rem;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-shadow: 0 0 8px #6ddcff, 0 2px 1px #000;
      transform: rotate(5deg);
    }

    h1 {
      color: #fff;
      font-size: clamp(2rem, 8vw, 3.1rem);
      line-height: 0.98;
      letter-spacing: -0.045em;
      text-shadow: 0 0 24px rgba(127, 151, 255, 0.72), 0 4px 2px rgba(0, 0, 0, 0.5);
    }

    .subtitle {
      color: #dfe5ff;
      letter-spacing: 0.035em;
    }

    #gameScreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: calc(var(--vh, 1vh) * 100);
      padding: 0.7rem;
      overflow: hidden;
    }

    .topbar {
      border: 1px solid rgba(145, 169, 255, 0.78);
      background: linear-gradient(90deg, rgba(9, 10, 54, 0.97), rgba(24, 24, 105, 0.94), rgba(9, 10, 54, 0.97));
      box-shadow: 0 0 30px rgba(67, 83, 255, 0.2);
    }

    .iconBtn {
      border-radius: 50%;
    }

    .statusRow {
      color: #f4f6ff;
      text-shadow: 0 1px 5px #000;
    }

    #questionNumber,
    #score {
      color: var(--gold-light);
    }

    #timerWrap {
      border: 2px solid #758cff;
      background: rgba(1, 2, 24, 0.95);
      box-shadow: inset 0 0 12px #000, 0 0 15px rgba(91, 112, 255, 0.38);
    }

    #timerFill {
      background: linear-gradient(90deg, #3c5cff, #9b63ff, #c4f7ff);
      box-shadow: 0 0 14px #8ba5ff;
    }

    #notice {
      color: #171000;
      border: 2px solid #fff1bd;
      background: linear-gradient(180deg, #ffec9f, var(--gold));
      box-shadow: 0 0 28px rgba(244, 185, 66, 0.42);
    }

    #questionCard {
      position: relative;
      color: #fff;
      border: 2px solid #9cabff;
      border-radius: 0.65rem;
      background:
        linear-gradient(90deg, rgba(5, 6, 40, 0.98), rgba(25, 28, 111, 0.98) 50%, rgba(5, 6, 40, 0.98));
      clip-path: polygon(3% 0, 97% 0, 100% 50%, 97% 100%, 3% 100%, 0 50%);
      box-shadow: inset 0 0 28px rgba(67, 89, 255, 0.19), 0 18px 42px rgba(0, 0, 0, 0.5);
    }

    #qEmoji {
      filter: drop-shadow(0 0 12px rgba(120, 167, 255, 0.8));
    }

    #qText {
      color: #fff;
      font-size: clamp(1.35rem, 5vw, 2.25rem);
      line-height: 1.12;
      text-shadow: 0 2px 2px #000;
    }

    #bossBadge {
      color: #1d1100;
      border: 1px solid #fff5ca;
      background: linear-gradient(180deg, #fff0ab, var(--gold));
      box-shadow: 0 0 15px rgba(244, 185, 66, 0.45);
    }

    .answer {
      position: relative;
      color: #fff;
      min-height: 4.35rem;
      border: 2px solid #7186ff;
      border-radius: 0.45rem;
      background:
        linear-gradient(105deg, rgba(4, 5, 34, 0.99), rgba(21, 22, 91, 0.98) 55%, rgba(7, 8, 48, 0.99));
      clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
      text-shadow: 0 2px 2px #000;
    }

    .answer > span:last-child {
      min-width: 0;
      overflow-wrap: anywhere;
      hyphens: auto;
    }

    .answer:hover:not(:disabled) {
      background: linear-gradient(105deg, #10165f, #303fc4 55%, #111966);
    }

    .answer .letter {
      color: #180d00;
      background: linear-gradient(180deg, #ffe8a0, var(--gold));
      box-shadow: 0 0 12px rgba(244, 185, 66, 0.42);
    }

    .answer.selected {
      color: #140c00;
      border-color: #fff0b5;
      background: linear-gradient(100deg, #d77c08, #ffd44b 52%, #d77c08);
      text-shadow: none;
      animation: lockPulse 0.72s ease-in-out infinite alternate;
    }

    @keyframes lockPulse {
      to { filter: brightness(1.18); box-shadow: 0 0 32px rgba(255, 190, 45, 0.72); }
    }

    .answer.correct {
      color: #00170a;
      border-color: #c9ffe1;
      background: linear-gradient(100deg, #049748, #42f58a 52%, #049748);
      text-shadow: none;
    }

    .answer.wrong {
      color: #fff;
      border-color: #ffb7bd;
      background: linear-gradient(100deg, #8f1024, #ed3148 52%, #8f1024);
    }

    #jokers {
      padding-top: 0.2rem;
    }

    .joker {
      color: #fff;
      border-color: #8ba0ff;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 25%, #3846c7, #11105f 68%, #070630);
      box-shadow: inset 0 0 18px rgba(118, 144, 255, 0.24), 0 0 18px rgba(65, 78, 238, 0.2);
    }

    .joker.used {
      color: #8a8da8;
      border-color: #3a3c62;
      background: #101126;
    }

    #moneyLadder {
      display: none;
    }

    #endAmount {
      color: var(--gold-light);
      text-shadow: 0 0 25px rgba(244, 185, 66, 0.72);
    }

    #toast {
      color: #fff;
      border-color: #879bff;
      background: rgba(7, 8, 49, 0.97);
      box-shadow: 0 0 28px rgba(89, 101, 255, 0.35);
    }

    /* =====================================================
       DESKTOP — OPTIMIERTES STUDIO-LAYOUT
       Topbar kompakt, Status zentriert, Frage prominent,
       Antworten im 2x2 Grid, Jokers als schmale Leiste
    ===================================================== */

    @media (min-width: 900px) {
      html {
        font-size: 22px;
      }

      #gameScreen {
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr) auto;
        grid-template-columns: 1fr;
        width: 100vw;
        height: calc(var(--vh, 1vh) * 100);
        padding:
          calc(0.6rem + env(safe-area-inset-top))
          calc(0.8rem + env(safe-area-inset-right))
          calc(0.6rem + env(safe-area-inset-bottom))
          calc(0.8rem + env(safe-area-inset-left));
        gap: 0.55rem;
        overflow: hidden;
      }

      #gameScreen > * {
        width: min(100%, 68rem);
        max-width: 100%;
        margin-inline: auto;
      }

      /* TOPBAR — kompakt, alle Controls in einer Reihe */
      .topbar {
        grid-row: 1;
        display: flex;
        flex-wrap: nowrap;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.6rem;
        border-width: 1px;
        border-radius: 0.9rem;
      }

      .topButtons {
        display: flex;
        gap: 0.35rem;
        align-items: center;
      }

      .iconBtn {
        min-width: 2.5rem;
        width: 2.5rem;
        min-height: 2.5rem;
        height: 2.5rem;
        flex: 0 0 2.5rem;
        padding: 0;
        border-width: 1px;
        font-size: 1.1rem;
      }

      .statusRow {
        grid-row: 2;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.7rem;
        align-items: center;
        font-size: 1rem;
        line-height: 1.1;
        padding: 0.25rem 0.4rem;
      }

      #questionNumber,
      #score {
        white-space: nowrap;
        font-weight: 900;
        font-size: 1.05rem;
      }

      .timerBox {
        gap: 0.4rem;
      }

      #timerWrap {
        height: 1rem;
        border-width: 1px;
      }

      #timerText {
        min-width: 2.6rem;
        font-size: 1.1rem;

    // ==============================
    // AUTO-FULLSCREEN & VH-FIX

    function setVh() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', () => setTimeout(setVh, 150));

    function tryFullscreen(el) {
      const target = el || document.documentElement;
      const rfs =
        target.requestFullscreen ||
        target.webkitRequestFullscreen ||
        target.mozRequestFullScreen ||
        target.msRequestFullscreen;
      if (rfs) {
        rfs.call(target).catch(function () {});
      }
    }

    function requestLockOrientation() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('portrait').catch(function () {});
        }
      } catch (e) {}
    }

    document.addEventListener('fullscreenchange', function () {
      setTimeout(setVh, 100);
    });

      const ladder = $('moneyLadder');
      if (!ladder) return;

      ladder.innerHTML = '';

        const level = MONEY.length - reverseIndex;
        const step = document.createElement('div');
        step.className = 'moneyStep';
        step.dataset.level = String(level - 1);

        if (level === 5 || level === 10 || level === 15) {

        const number = document.createElement('span');
        number.textContent = level;

        const prize = document.createElement('span');
        prize.textContent = amount + ' €';

        step.appendChild(number);

        ladder.appendChild(step);
      });

      updateMoneyLadder();

        if (DIFFICULTIES[parsed.difficulty]) settings.difficulty = parsed.difficulty;

        effectivePx = Math.max(16, Math.min(24, settings.fontPx * 0.85));

    function musicTone(freq, dur, type, gain, delay) {
      if (!audioCtx || !musicGain) return;

      const t = audioCtx.currentTime + (delay || 0);

      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(Math.max(260, freq * 5), t);
      filter.Q.value = 1.4;

      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.035);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      osc.connect(filter);
      filter.connect(g);
      g.connect(musicGain);

      osc.start(t);
      osc.stop(t + dur + 0.06);
    }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 9000;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      source.connect(filter);
      filter.connect(g);
      g.connect(musicGain);
      source.start(t);
    }

    function bassline(freq, dur, gain) {
      if (!audioCtx || !musicGain) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(280, t);
      filter.frequency.exponentialRampToValueAtTime(900, t + dur * 0.25);
      filter.frequency.exponentialRampToValueAtTime(180, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.015);
      g.gain.setValueAtTime(gain * 0.85, t + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(filter);
      filter.connect(g);
      g.connect(musicGain);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    }

    function arpNote(freq, dur, gain, delay) {
      musicTone(freq, dur, 'square', gain, delay);
    }

    function startBGM() {
      if (!settings.music) return;

      const group = run.qIndex === MONEY.length - 1 ? 'finale' : 'quiz';
      const tracks = BGM_TRACKS[group];
      const source = tracks[run.trackVariant % tracks.length];

      if (!bgmAudio) {
        bgmAudio = new Audio();
        bgmAudio.loop = true;
        bgmAudio.preload = 'auto';
        bgmAudio.volume = 0.32;
      }

      if (bgmSource !== source) {
        bgmAudio.pause();
        bgmAudio.src = source;
        bgmAudio.currentTime = 0;
        bgmSource = source;
      }

      bgmAudio.play().catch(function () {
        toast('Musik konnte nicht gestartet werden.');
      });
      return;

      ensureAudio();

      if (!audioCtx) return;

      const mood = Math.min(2, Math.floor(run.qIndex / 5));
      if (bgmTimer && bgmMood === mood) return;

      stopBGM();

      bgmStep = 0;
      bgmMood = mood;

      const tempos = [132, 148, 168];
      const bpm = tempos[mood];
      const beatDur = 60 / bpm;
      const rootsByMood = [
        [65.41, 58.27, 61.74, 55],
        [58.27, 51.91, 55, 49],
        [51.91, 46.25, 49, 43.65]
      ];
      const roots = rootsByMood[mood];

      const arpPatterns = [
        [1, 1.5, 2, 1.5, 1, 1.5, 2, 3],
        [1, 1.25, 1.5, 2, 1.5, 1.25, 1, 1.5],
        [1, 2, 1.5, 2, 3, 2, 1.5, 1]
      ];
      const arpPattern = arpPatterns[mood];

      bgmTimer = setInterval(function () {
        bgmStep++;

        const root = roots[Math.floor(bgmStep / 8) % roots.length];
        const danger = run.timeLimit > 0 && run.timeLeft / run.timeLimit < 0.28;
        const stepInBeat = bgmStep % 4;

        // KICK DRUM - four-on-the-floor, treibend
        if (stepInBeat === 0) {
          kickDrum(0.55, 0);
        }

        // SNARE auf 2 und 4
        if (stepInBeat === 2) {
          snare(mood === 2 ? 0.22 : 0.16, 0);
        }

        // HIHAT - 16tel für Drive
        hihat(mood === 2 ? 0.09 : 0.06, 0);
        if (mood > 0 && (stepInBeat === 1 || stepInBeat === 3)) {
          hihat(mood === 2 ? 0.12 : 0.08, beatDur * 0.5);
        }

        // BASSLINE - pumpend, dominant
        if (stepInBeat === 0) {
          bassline(root * 2, beatDur * 0.85, mood === 2 ? 0.4 : 0.32);
        }
        if (stepInBeat === 2 && mood > 0) {
          bassline(root * 2.5, beatDur * 0.65, 0.26);
        }
        // Octave-Jump für Energie in Mood 2
        if (mood === 2 && stepInBeat === 3) {
          bassline(root * 4, beatDur * 0.4, 0.2);
        }

        // ARPEGGIO - melodischer Drive
        if (bgmStep % 2 === 0) {
          const arpIndex = Math.floor(bgmStep / 2) % arpPattern.length;
          const arpFreq = root * 4 * arpPattern[arpIndex];
          arpNote(arpFreq, beatDur * 0.35, mood === 2 ? 0.09 : 0.07, 0);
        }

        // CHORD STABS - Akzente
        if (bgmStep % 8 === 1) {
          musicChord(root * 2, beatDur * 2, mood === 2 ? 0.14 : 0.1);
        }

        // SYNTH RISER für Spannung
        if (bgmStep % 16 === 15 && mood > 0) {
          musicTone(root * 3, beatDur * 2, 'sine', 0.05, beatDur);
        }

        // DANGER MODE - zusätzlicher Druck
        if (danger) {
          if (stepInBeat === 0 || stepInBeat === 2) {
            musicTone(880, 0.06, 'square', 0.07, 0);
          }
          if (bgmStep % 4 === 0) {
            kickDrum(0.35, beatDur * 0.5);
          }
          // Extra HiHat-Rolls
          hihat(0.1, beatDur * 0.25);
          hihat(0.1, beatDur * 0.75);
        }

        // MOOD 2 - Extra Intensität
        if (mood === 2 && bgmStep % 16 === 0) {
          musicChord(root * 4, beatDur * 4, 0.09);
        }
      }, beatDur * 1000);
    }

    function stopBGM(resetTrack) {
      if (bgmAudio) {
        bgmAudio.pause();
        if (resetTrack) {
          bgmAudio.currentTime = 0;
          bgmSource = '';
          bgmAudio.removeAttribute('src');
          bgmAudio.load();
        }
      }

      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }

      bgmMood = -1;
    }

    function toggleMusic() {
      settings.music = !settings.music;
      saveSettings();
      updateButtons();

      if (settings.music && !$('gameScreen').hidden && !run.paused) {
        startBGM();
        toast('🎵 Musik an');
      } else {
        stopBGM();
        toast('🚫 Musik aus');
      }
    }

    function toggleSpeech() {
      settings.speech = !settings.speech;
      saveSettings();
      updateButtons();

      if (!settings.speech && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      toast(settings.speech ? '🗣️ Sprachausgabe an' : '🔇 Sprachausgabe aus');
      if (settings.speech) speak('Sprachausgabe eingeschaltet.');
    }

    function speak(text, force) {
      if (!settings.speech && !force) return;
      if (!('speechSynthesis' in window)) return;

      try {
        window.speechSynthesis.cancel();

        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        u.rate = 1.0;
        u.pitch = 1;
        u.volume = 0.45;

        const voices = window.speechSynthesis.getVoices();
        const de = voices.find(function (v) {
          return v.lang && v.lang.toLowerCase().startsWith('de');
        });

        if (de) u.voice = de;

        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function prepareRun() {
      if (transitionTimer) clearTimeout(transitionTimer);
      if (run.timerInterval) clearInterval(run.timerInterval);
      stopBGM(true);

      const difficulty = DIFFICULTIES[settings.difficulty]
        ? settings.difficulty
        : 'normal';
      const questionPool = buildQuestionPool(difficulty);
      const questionTime = DIFFICULTIES[difficulty].time;

      run = {
        answered: 0,
        qIndex: 0,
        score: 0,
        streak: 0,
        locked: false,
        active: false,
        paused: false,
        pauseReason: null,
        pendingActivate: false,
        question: null,
        questionPool: questionPool,
        difficulty: difficulty,
        trackVariant: difficulty === 'hard' ? 1 : difficulty === 'easy' ? 0 : Math.floor(Math.random() * 2),
        timerInterval: null,
        timeLeft: questionTime,
        timeLimit: questionTime,
        selectTimeLeft: 0,
        lastTick: 0,
        jokers: {
          fifty: false,
          hint: false,
          time: false
        }
      };

      ['j5050', 'jHint', 'jTime'].forEach(function (id) {
        const btn = $(id);
        if (!btn) return;

        btn.disabled = false;
        btn.classList.remove('used');
      });

      updateScoreUI();
      document.body.classList.remove('timeDanger');
    }

    function shuffleArray(items) {
      const shuffled = items.slice();

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const current = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = current;
      }

      return shuffled;
    }

    function buildQuestionPool(difficultyKey) {
      const config = DIFFICULTIES[difficultyKey];
      const tierCount = config.lastTier - config.firstTier + 1;
      const tierUse = {};
      const shuffledTiers = QUESTION_LADDER.map(function (tier) {
        return shuffleArray(tier);
      });

      return MONEY.map(function (_, questionIndex) {
        const tierOffset = Math.min(
          tierCount - 1,
          Math.floor(questionIndex * tierCount / MONEY.length)
        );
        const tierIndex = config.firstTier + tierOffset;
        const usedInTier = tierUse[tierIndex] || 0;
        tierUse[tierIndex] = usedInTier + 1;

        return shuffledTiers[tierIndex][usedInTier % shuffledTiers[tierIndex].length];
      });
    }

    function startRun() {
      if (startupLock) return;

      tryFullscreen(document.documentElement);
      requestLockOrientation();

      startupLock = true;

      ensureAudio();
      prepareRun();
      showScreen('gameScreen');
      loadQuestion();

      speak('Los geht es.');

      transitionTimer = setTimeout(function () {
        startupLock = false;

        if ($('gameScreen').hidden) return;

        if (document.hidden) {
          run.pendingActivate = true;
        } else {
          activateQuestion();
        }
      }, 1400);
    }

    function generateQuestion(level) {
      const source = run.questionPool[level];
      const options = shuffleArray(source.options);

      return {
        clue: source.question,
        emoji: source.emoji,
        options: options,
        correct: source.answer,
        correctIndex: options.indexOf(source.answer),
        fact: source.fact
      };
    }

    function loadQuestion() {
      if (run.answered >= MONEY.length) {
        showWin();
        return;
      }

      run.qIndex = run.answered;
      run.locked = false;
      run.active = false;
      run.paused = false;
      run.pauseReason = null;
      run.pendingActivate = false;

      const isSafetyLevel = run.qIndex === 4 || run.qIndex === 9;
      const isMillionQuestion = run.qIndex === MONEY.length - 1;

      run.question = generateQuestion(run.qIndex);
      run.question.boss = isSafetyLevel || isMillionQuestion;

      $('qEmoji').textContent = run.question.emoji;
      $('qText').textContent = run.question.clue;
      $('bossBadge').hidden = !run.question.boss;
      $('bossBadge').textContent = isMillionQuestion
        ? '👑 Die Millionenfrage'
        : '🔒 Sicherheitsstufe';

      renderAnswers();
      updateScoreUI();
      updateMoneyLadder();

      run.timeLimit = DIFFICULTIES[run.difficulty].time;
      run.timeLeft = run.timeLimit;
      run.lastTick = 0;

      updateTimerUI();
      setAnswersEnabled(false);

      $('questionNumber').textContent =
        'Frage ' + Math.min(15, run.qIndex + 1) + '/15 · ' +
        DIFFICULTIES[run.difficulty].label;

      if (isSafetyLevel) {
        showNotice('🔒 Diese Frage sichert ' + MONEY[run.qIndex] + ' €');
      } else if (isMillionQuestion) {
        showNotice('👑 Jetzt geht es um die Million!');
      }
    }

    function activateQuestion() {
      if ($('gameScreen').hidden || run.active || run.paused) return;

      run.active = true;
      run.pendingActivate = false;

      setAnswersEnabled(true);
      startTimer();
      startBGM();
      speakQuestion();
    }

    function renderAnswers() {
      const wrap = $('answers');
      if (!wrap) return;

      wrap.innerHTML = '';

      run.question.options.forEach(function (opt, i) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'answer';
        btn.id = 'answer-' + i;
        btn.disabled = true;

        const letter = document.createElement('span');
        letter.className = 'letter';
        letter.textContent = LETTERS[i];

        const text = document.createElement('span');
        text.textContent = opt;

        btn.appendChild(letter);
        btn.appendChild(text);

        btn.setAttribute(
          'aria-label',
          'Antwort ' + LETTERS[i] + ': ' + opt
        );

        btn.addEventListener('click', function () {
          selectAnswer(i);
        });

        wrap.appendChild(btn);
      });
    }

    function setAnswersEnabled(enabled) {
      const wrap = $('answers');
      if (!wrap) return;

      Array.from(wrap.children).forEach(function (btn) {
        if (btn.classList.contains('disabled')) {
          btn.disabled = true;
        } else {
          btn.disabled = !enabled;
        }
      });
    }

    function updateScoreUI() {
      const scoreEl = $('score');
      if (!scoreEl) return;

      const won = run.score ? run.score + ' €' : '0 €';
      const wonIndex = run.score ? MONEY.indexOf(run.score) : -1;
      const nextIndex = Math.min(MONEY.length - 1, wonIndex + 1);
      const next = MONEY[nextIndex] + ' €';

      scoreEl.textContent =
        (run.streak > 1 ? '🔥 ' + run.streak + ' · ' : '') +
        won + ' → ' + next;

      updateMoneyLadder();
    }

    function startTimer() {
      clearTimer();

      run.timerInterval = setInterval(function () {
        run.timeLeft -= 0.1;

        if (run.timeLeft <= 0) {
          clearTimer();
          timeUp();
        }

        updateTimerUI();

        const pct = Math.max(0, (run.timeLeft / run.timeLimit) * 100);
        const sec = Math.ceil(run.timeLeft);

        if (pct < 25 && sec !== run.lastTick) {
          run.lastTick = sec;
          sfxTone(950, 0.05, 'square', 0.03);
        }
      }, 100);
    }

    function clearTimer() {
      if (run.timerInterval) {
        clearInterval(run.timerInterval);
        run.timerInterval = null;
      }
    }

    function updateTimerUI() {
      const pct = Math.max(0, (run.timeLeft / run.timeLimit) * 100);

      const fill = $('timerFill');
      const text = $('timerText');

      if (!fill || !text) return;

      fill.style.width = Math.min(100, pct) + '%';
      fill.classList.toggle('low', pct < 30);
      text.textContent = Math.ceil(run.timeLeft) + 's';

      document.body.classList.toggle(
        'timeDanger',
        pct < 25 && !$('gameScreen').hidden
      );
    }

    function timeUp() {
      if (!run.active || run.locked || run.paused) return;

      run.locked = true;
      run.active = false;

      setAnswersEnabled(false);
      stopBGM();
      sfxWrong();

      speak('Die Zeit ist vorbei.');

      const correctBtn = $('answer-' + run.question.correctIndex);
      if (correctBtn) {
        correctBtn.classList.add('correct');
      }

      setTimeout(function () {
        if ($('gameScreen').hidden) return;
        showWrong('Zeit ist vorbei.');
      }, 1600);
    }

    function selectAnswer(i) {
      if (!run.active || run.locked || run.paused) return;

      const btn = $('answer-' + i);
      if (!btn || btn.disabled) return;

      run.locked = true;
      run.active = false;
      run.selectTimeLeft = run.timeLeft;

      clearTimer();
      setAnswersEnabled(false);

      btn.classList.add('selected');
      sfxSuspense();
      haptic(28);

      speak('Antwort ' + LETTERS[i] + ' ist eingeloggt. Ist das richtig?');

      setTimeout(function () {
        if ($('gameScreen').hidden) return;
        revealAnswer(i);
      }, run.qIndex >= 10 ? 1800 : 1250);
    }

    function revealAnswer(i) {
      const q = run.question;

      const selectedBtn = $('answer-' + i);
      const correctBtn = $('answer-' + q.correctIndex);

      if (!selectedBtn || !correctBtn) return;

      if (i === q.correctIndex) {
        selectedBtn.classList.remove('selected');
        selectedBtn.classList.add('correct');

        sfxCorrect();
        haptic([30, 45, 70]);
        confetti(30);

        run.score = MONEY[run.qIndex];
        run.streak++;

        updateScoreUI();

        speak('Das ist richtig! ' + q.fact);

        if (run.qIndex === MONEY.length - 1) {
          stopBGM();

          setTimeout(function () {
            if ($('gameScreen').hidden) return;
            showWin();
          }, 1600);
        } else {
          setTimeout(function () {
            if ($('gameScreen').hidden) return;

            run.answered++;
            loadQuestion();
            showNotice('Frage ' + (run.qIndex + 1) + ' kommt …');

            transitionTimer = setTimeout(function () {
              if ($('gameScreen').hidden) return;

              if (document.hidden) {
                run.pendingActivate = true;
              } else {
                activateQuestion();
              }
            }, 1100);
          }, 1200);
        }
      } else {
        selectedBtn.classList.remove('selected');
        selectedBtn.classList.add('wrong');
        correctBtn.classList.add('correct');

        run.streak = 0;
        updateScoreUI();

        sfxWrong();
        haptic([85, 45, 85]);
        stopBGM();

        speak('Leider falsch. Richtig wäre ' + q.correct + ' gewesen. ' + q.fact);

        setTimeout(function () {
          if ($('gameScreen').hidden) return;
          showWrong('Falsche Antwort.');
        }, 1650);
      }
    }

    function showWin() {
      stopBGM();
      clearTimer();

      run.active = false;
      run.locked = true;
      run.paused = false;
      run.pendingActivate = false;

      document.body.classList.remove('timeDanger');

      $('endTitle').textContent = '🎉 Millionär!';
      $('endAmount').textContent = MONEY[MONEY.length - 1] + ' €';
      $('endText').textContent =
        'Alle 15 Fragen richtig. Serie: ' + run.streak + '.';

      showScreen('endScreen');
      confetti(200);
      sfxCorrect();

      speak('Glückwunsch! Sie haben die Million gewonnen!');
    }

    function showWrong(reason) {
      stopBGM();
      clearTimer();

      run.active = false;
      run.locked = true;
      run.paused = false;
      run.pendingActivate = false;

      document.body.classList.remove('timeDanger');

      $('endTitle').textContent = 'Schade!';
      const guaranteed = run.answered >= 10
        ? MONEY[9]
        : (run.answered >= 5 ? MONEY[4] : '0');

      $('endAmount').textContent = guaranteed + ' €';
      $('endText').textContent =
        reason + ' ' +
        'Richtig war: ' + run.question.correct + '. ' +
        run.question.fact;

      showScreen('endScreen');
    }

    function quitGame() {
      stopBGM();
      clearTimer();

      if (transitionTimer) clearTimeout(transitionTimer);
      if (noticeTimer) clearTimeout(noticeTimer);
      if (toastTimer) clearTimeout(toastTimer);

      startupLock = false;

      run.active = false;
      run.locked = false;
      run.paused = false;
      run.pauseReason = null;
      run.pendingActivate = false;

      document.body.classList.remove('timeDanger');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      showScreen('startScreen');
      updateButtons();
    }

    function useFifty() {
      if (!run.active || run.locked || run.paused || run.jokers.fifty || $('j5050').disabled) return;

      run.jokers.fifty = true;
      $('j5050').disabled = true;
      $('j5050').classList.add('used');

      sfxClick();
      haptic(20);
      toast('50:50');

      const q = run.question;

      const wrongs = q.options
        .map(function (_, i) {
          return i;
        })
        .filter(function (i) {
          const btn = $('answer-' + i);
          return i !== q.correctIndex && btn && !btn.disabled;
        });

      wrongs.sort(function () {
        return Math.random() - 0.5;
      });

      wrongs.slice(0, 2).forEach(function (i) {
        const btn = $('answer-' + i);
        if (!btn) return;

        btn.disabled = true;
        btn.classList.add('disabled');
      });

      speak('Der 50:50-Joker entfernt zwei falsche Antworten.');
    }

    function useHint() {
      if (!run.active || run.locked || run.paused || run.jokers.hint || $('jHint').disabled) return;

      run.jokers.hint = true;
      $('jHint').disabled = true;
      $('jHint').classList.add('used');

      sfxClick();
      haptic(20);

      const q = run.question;
      const weights = q.options.map(function (_, i) {
        return i === q.correctIndex
          ? 55 + Math.random() * 20
          : 7 + Math.random() * 14;
      });
      const total = weights.reduce(function (sum, value) {
        return sum + value;
      }, 0);
      const percentages = weights.map(function (value) {
        return Math.round(value / total * 100);
      });
      percentages[q.correctIndex] += 100 - percentages.reduce(function (sum, value) {
        return sum + value;
      }, 0);

      percentages.forEach(function (percent, i) {
        const btn = $('answer-' + i);
        if (btn && btn.children[1]) {
          btn.children[1].textContent = q.options[i] + ' · ' + percent + ' %';
        }
      });

      const result = percentages.map(function (percent, i) {
        return LETTERS[i] + ' ' + percent + ' Prozent';
      }).join(', ');

      showNotice('👥 Publikum: ' + percentages.map(function (percent, i) {
        return LETTERS[i] + ' ' + percent + ' %';
      }).join(' · '));
      speak('Das Publikum hat abgestimmt. ' + result + '.');
    }

    function useTimeBonus() {
      if (!run.active || run.locked || run.paused || run.jokers.time || $('jTime').disabled) return;

      run.jokers.time = true;
      $('jTime').disabled = true;
      $('jTime').classList.add('used');

      run.timeLeft += 10;
      updateTimerUI();

      sfxClick();
      haptic(20);
      toast('+10 Sekunden');

      speak('Zeitbonus: plus zehn Sekunden.');
    }

    function pauseGame(reason, silent) {
      if (!$('gameScreen').hidden && run.active && !run.locked && !run.paused) {
        run.paused = true;
        run.pauseReason = reason || 'manual';

        clearTimer();
        stopBGM();
        setAnswersEnabled(false);
        document.body.classList.remove('timeDanger');

        if (!silent) {
          showNotice('Pause');
        }

        updatePauseButton();
      }
    }

    function resumeGame() {
      if (!$('gameScreen').hidden && run.paused && run.active && !run.locked) {
        run.paused = false;
        run.pauseReason = null;

        showNotice('Weiter geht’s');
        startTimer();
        setAnswersEnabled(true);

        if (settings.music) {
          startBGM();
        }

        updatePauseButton();
      }
    }

    function togglePause() {
      if (run.paused) {
        if (run.active) {
          resumeGame();
        } else {
          run.paused = false;
          run.pauseReason = null;
          updatePauseButton();
        }
      } else {
        pauseGame('manual', false);
      }
    }

    function updatePauseButton() {
      const btn = $('btnPause');
      if (!btn) return;

      btn.textContent = run.paused ? '▶️' : '⏸️';
      btn.setAttribute('aria-label', run.paused ? 'Weiter' : 'Pause');
    }

    function onVisibilityChange() {
      if (document.hidden) {
        if (run.active && !run.locked && !run.paused) {
          pauseGame('auto', true);
        }
      } else {
        if ($('gameScreen').hidden) return;

        if (run.pendingActivate) {
          run.pendingActivate = false;
          activateQuestion();
        } else if (run.paused && run.active && !run.locked && run.pauseReason === 'auto') {
          resumeGame();
        }
      }
    }

    function bindButtons() {
      $('btnStart').addEventListener('click', function () {
        ensureAudio();
        startRun();
      });

      $('btnIntro').addEventListener('click', function () {
        ensureAudio();
        sfxClick();

        speak(
          'Anleitung. ' +
          'Sie bekommen eine Frage und vier Antworten. ' +
          'Je nach Schwierigkeit haben Sie 75, 60 oder 45 Sekunden pro Frage. ' +
          'Tippen Sie auf die richtige Antwort. ' +
          'Mit 50:50 werden zwei falsche Antworten entfernt. ' +
          'Der Publikumsjoker zeigt die Abstimmung im Studio. ' +
          'Mit plus Zeit bekommen Sie zehn Sekunden extra. ' +
          'Viel Erfolg!',
          true
        );

        toast('Anleitung wird vorgelesen.');
      });

      $('btnMusicStart').addEventListener('click', toggleMusic);
      $('btnMusic').addEventListener('click', toggleMusic);
      $('btnSpeechStart').addEventListener('click', toggleSpeech);
      $('btnSpeech').addEventListener('click', toggleSpeech);

      document.querySelectorAll('.difficultyBtn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          settings.difficulty = btn.dataset.difficulty;
          saveSettings();
          updateButtons();
          sfxClick();
          toast('Schwierigkeit: ' + DIFFICULTIES[settings.difficulty].label);
        });
      });

      $('btnFontMinusStart').addEventListener('click', function () {
        changeFont(-2);
      });

      $('btnFontPlusStart').addEventListener('click', function () {
        changeFont(2);
      });

      $('btnFontMinus').addEventListener('click', function () {
        changeFont(-2);
      });

      $('btnFontPlus').addEventListener('click', function () {
        changeFont(2);
      });

      $('btnPause').addEventListener('click', togglePause);
      $('btnQuit').addEventListener('click', quitGame);

      $('j5050').addEventListener('click', useFifty);
      $('jHint').addEventListener('click', useHint);
      $('jTime').addEventListener('click', useTimeBonus);

      $('btnRestart').addEventListener('click', function () {
        ensureAudio();
        startRun();
      });

      $('btnHome').addEventListener('click', function () {
        sfxClick();
        showScreen('startScreen');
        updateButtons();
      });

      $('questionCard').addEventListener('click', function () {
        if (!$('gameScreen').hidden && run.question) {
          speakQuestion();
        }
      });

      document.addEventListener('keydown', onKeydown);
    }

    function speakQuestion() {
      if (!run.question) return;

      const q = run.question;

      let text =
        'Frage ' + (run.qIndex + 1) + '. ' +
        q.clue + ' ';

      q.options.forEach(function (opt, i) {
        text += LETTERS[i] + ': ' + opt + '. ';
      });

      speak(text);
    }

    function onKeydown(e) {
      if (e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) {
        return;
      }

      if (!$('startScreen').hidden && e.key === 'Enter') {
        e.preventDefault();
        ensureAudio();
        startRun();
        return;
      }

      if (!$('endScreen').hidden && e.key === 'Enter') {
        e.preventDefault();
        ensureAudio();
        startRun();
        return;
      }

      if (!$('gameScreen').hidden) {
        if (!run.active || run.locked || run.paused) return;

        if (e.key === '1' || e.key.toLowerCase() === 'a') {
          e.preventDefault();
          selectAnswer(0);
        }

        if (e.key === '2' || e.key.toLowerCase() === 'b') {
          e.preventDefault();
          selectAnswer(1);
        }

        if (e.key === '3' || e.key.toLowerCase() === 'c') {
          e.preventDefault();
          selectAnswer(2);
        }

        if (e.key === '4' || e.key.toLowerCase() === 'd') {
          e.preventDefault();
          selectAnswer(3);
        }
      }
    }
  </script>
</body>
</html>
